<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<!-- iPhone/iPad: via "Zet op beginscherm" opent deze pagina beeldvullend, zonder de balken van Safari, en met zwarte randen -->
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strook">
<link rel="manifest" href="strook.webmanifest">
<meta name="robots" content="noindex">
<title>Ankeveen in beweging</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../fonts/fonts.css?v=20261106b">
<!--
  Alleen de animatiestrook van de verenigingenpagina, beeldvullend, om te projecteren (bijvoorbeeld in het theater).

  Adres:  strook.html            de band onderin beeld, een kwart van de beeldhoogte, daarboven pikzwart
  Opties achter het adres (te combineren met &):
    ?h=30             de band 30% van de beeldhoogte (standaard 25)
    ?b=400            in plaats daarvan: hoeveel "strookpixels" er op de schermbreedte passen (kleiner = alles groter)
    ?lucht            een zomerse blauwe lucht met zon, wolken en gras in de band (daarboven blijft het zwart)
    ?lucht&vol        die lucht over het hele beeld
    ?licht            licht in plaats van zwart rond de band
    ?pos=midden       strook in het midden (of boven); standaard onder
    ?titel=Tekst      een titel boven de strook (staat "Ankeveen" erin, dan stuitert de voetbal over de letters)
    #naam             meteen één groep laten zien, zoals op de gewone pagina (bijvoorbeeld #sportdag)
  Klik op het scherm (of druk op F) voor volledig scherm.

  Werking: de buitenste pagina zet de strook in een iframe en vergroot dat. Binnen het iframe is alles op ware
  grootte, zodat ontmoeten.js ongewijzigd blijft.
-->
<style>
html,body{margin:0;height:100%}
body.buiten{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#f8f6f0;cursor:none;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
body.buiten.zwart{background:#000}
body.buiten iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block;background:#fff;pointer-events:none}
body.binnen{background:#fff;overflow:hidden}
/* projectiestand: helder wit vlak en een stevige grondlijn, voor een donkere of houten wand */
body.binnen #ontmoeten::after{background:#6f6a5e;height:1.5px}
/* ?lucht: een zomerse blauwe lucht over het hele beeld, met zon, wolken en gras. De strook zelf is dan doorzichtig. */
body.buiten.lucht iframe{background:transparent}
body.binnen.lucht{background:transparent}
body.binnen.lucht #ontmoeten::after{background:#4E8A3A}
.wolk{position:absolute;left:0;fill:#fff;opacity:.93;will-change:transform;animation:drijf linear infinite}
@keyframes drijf{from{transform:translateX(-30vw)}to{transform:translateX(112vw)}}
.zon{position:absolute;border-radius:50%;background:radial-gradient(circle,#FFF7C2 0 34%,#FFE35C 52%,rgba(255,227,92,.35) 62%,rgba(255,227,92,0) 72%)}
/* dezelfde regels als op de verenigingenpagina (index.html) */
#ontmoeten{position:relative;height:64px;overflow:visible;clip-path:inset(-80px 0 0 0);background:transparent}
#ontmoeten::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#d9d3c4}
#ontmoeten .om-p{position:absolute;left:0;top:0;will-change:transform}
#ontmoeten .om-p svg{display:block}
#ontmoeten .om-bubble{position:absolute;left:0;top:0;background:#fff;border:1.5px solid #1b4f9c;border-radius:9px;padding:2px 5px;display:flex;gap:2px;box-shadow:0 1px 3px rgba(22,35,58,.12)}
#ontmoeten .om-conf{position:absolute;left:0;top:0;width:3px;height:5px;border-radius:1px;pointer-events:none}
#ontmoeten .om-ring{position:absolute;left:0;top:0;width:10px;height:10px;border:1.5px solid #2BB39A;border-radius:50%;pointer-events:none}
#ontmoeten .om-ball{position:absolute;left:0;top:0;width:7px;height:7px;pointer-events:none;will-change:transform}
#ontmoeten .om-p{z-index:1}
#ontmoeten .om-p.om-kraam{transform-origin:50% 100%;z-index:0}
#ontmoeten .om-p.om-achter{z-index:0}
#ontmoeten .om-bubble,#ontmoeten .om-note,#ontmoeten .om-ring,#ontmoeten .om-conf,#ontmoeten .om-ball{z-index:2}
#ontmoeten .om-note{position:absolute;left:0;top:0;font-size:13px;line-height:1;font-weight:700;pointer-events:none}
#ontmoeten .om-bubble span{width:3px;height:3px;border-radius:50%;background:#16233a;opacity:.7}
</style>
</head>
<body>
<script>
(function () {
    var q = new URLSearchParams(location.search), binnen = q.has('binnen');
    // De band is zo krap mogelijk, zodat alles zo groot mogelijk in beeld komt: de torenspits van De Dillewijn reikt
    // net tot de bovenrand (19 px boven de strook) en onder de grondlijn zit nog maar een smal randje. Alleen met een
    // titel erboven is er meer lucht nodig.
    var KOP = q.get('titel') ? 58 : 19, RAND = 2, HOOGTE = KOP + 64 + RAND;
    if (binnen) {
        // de strook zelf, op ware grootte
        document.body.className = 'binnen projectie' + (q.has('lucht') ? ' lucht' : '');
        var titel = q.get('titel') || '';
        document.body.innerHTML =
            '<div id="topbar" style="position:relative;z-index:0;overflow:hidden;background:' + (q.has('lucht') ? 'transparent' : '#fff') + ';font-family:Inter,system-ui,sans-serif;padding-bottom:' + RAND + 'px">' +
            '<div style="height:' + KOP + 'px;box-sizing:border-box;overflow:hidden;padding:' + (KOP > 30 ? 14 : 0) + 'px clamp(12px,4.5vw,60px) 0;display:flex;align-items:flex-start">' +
            '<a style="font-family:Fraunces,Georgia,serif;font-size:1.3rem;font-weight:700;color:#2d4a3e;text-decoration:none;white-space:nowrap"></a></div>' +
            '<div id="ontmoeten" aria-hidden="true"></div></div>';
        document.querySelector('#topbar a').textContent = titel;
        var s = document.createElement('script'); s.src = 'ontmoeten.js?v=' + new Date().toISOString().slice(0, 13);     // elk uur de nieuwste versie
        document.body.appendChild(s);
        return;
    }
    // de buitenste pagina: het iframe met de strook, vergroot tot de volle schermbreedte
    var lucht = q.has('lucht'), vol = lucht && q.has('vol'), licht = !lucht && q.has('licht');
    document.body.className = 'buiten' + (lucht ? ' lucht' : licht ? '' : ' zwart');
    // ook de randen buiten de pagina (rond de inkeping, bij doorveren, de balken van de browser) in de goede kleur
    var rand = vol ? '#2E86D8' : licht ? '#f8f6f0' : '#000';
    document.documentElement.style.background = rand; document.body.style.background = rand;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', rand);
    // Grootte: standaard is de band een kwart van de beeldhoogte (?h=30 voor 30%). Met ?b=... bepaal je in plaats
    // daarvan hoeveel strookpixels er op de breedte passen.
    var hq = parseFloat(q.get('h')), deel = hq > 0 ? Math.min(1, hq > 1 ? hq / 100 : hq) : .25;
    var bq = parseFloat(q.get('b')), pos = q.get('pos') || 'onder';
    var f = document.createElement('iframe');
    f.title = 'Animatiestrook Ankeveen';
    f.src = 'strook.html?binnen' + (lucht ? '&lucht' : '') + (q.get('titel') ? '&titel=' + encodeURIComponent(q.get('titel')) : '') + (q.get('seizoen') ? '&seizoen=' + encodeURIComponent(q.get('seizoen')) : '') + location.hash;
    // de zomerlucht: zon en een paar wolken die langzaam overdrijven (achter de strook). Standaard alleen in de band
    // (daarboven zwart); met ?lucht&vol over het hele beeld.
    var hemel = null, WOLKEN = [[.06, .26, 150, 0], [.34, .16, 190, -70], [.16, .34, 230, -150], [.50, .20, 170, -120], [.62, .30, 210, -30], [.40, .13, 260, -200]];
    if (lucht) {
        hemel = document.createElement('div'); hemel.style.cssText = 'position:absolute;left:0;right:0;overflow:hidden;pointer-events:none';
        var W1 = 'M14 30 Q2 30 2 21 Q2 13 11 13 Q12 4 23 4 Q31 4 34 10 Q38 6 44 8 Q51 10 51 17 Q60 17 60 24 Q60 30 52 30 Z';
        var W2 = 'M10 26 Q2 26 2 19 Q2 13 9 13 Q11 6 20 6 Q27 6 30 11 Q39 9 41 17 Q48 17 48 22 Q48 26 42 26 Z';
        var html = '<div class="zon"></div>';
        WOLKEN.forEach(function (c, i) {
            html += '<svg class="wolk" viewBox="0 0 62 34" style="animation-duration:' + c[2] + 's;animation-delay:' + c[3] + 's"><path d="' + (i % 2 ? W2 : W1) + '"/></svg>';
        });
        hemel.innerHTML = html; document.body.appendChild(hemel);
    }
    document.body.appendChild(f);
    function pas() {
        var W = innerWidth, H = innerHeight;
        var z = bq > 0 ? W / Math.max(280, Math.min(3000, bq)) : deel * H / HOOGTE, b = Math.max(200, W / z);
        f.style.width = b + 'px'; f.style.height = HOOGTE + 'px';
        var top = Math.max(0, pos === 'boven' ? 0 : pos === 'onder' ? H - HOOGTE * z : (H - HOOGTE * z) / 2);
        f.style.transform = 'translate(0px, ' + top + 'px) scale(' + z + ')';
        if (lucht) {
            // de horizon ligt op de grondlijn van de strook: daarboven lucht (bovenin dieper blauw), daaronder gras
            var boven = vol ? 0 : top, g = top - boven + (KOP + 64 - 6) * z, luchtH = Math.max(0, g - 30 * z);
            hemel.style.top = boven + 'px'; hemel.style.height = (vol ? H : H - top) + 'px';
            hemel.style.background = 'linear-gradient(180deg, #2E86D8 0px, #6DB9EE ' + (g * .55) + 'px, #CFEBFA ' + g + 'px, #7DB85A ' + g + 'px, #5E9C42 100%)';
            var zon = hemel.firstChild, d = vol ? Math.min(W, H) * .34 : g * .62;
            zon.style.width = zon.style.height = d + 'px'; zon.style.right = (W * .04) + 'px'; zon.style.top = (vol ? Math.max(-d * .1, g * .08) : -d * .12) + 'px';
            [].forEach.call(hemel.querySelectorAll('.wolk'), function (w, i) {
                var c = WOLKEN[i];
                w.style.top = (c[0] * luchtH) + 'px'; w.style.width = (vol ? c[1] * W : c[1] * g * 1.5) + 'px';
            });
        }
    }
    pas(); addEventListener('resize', pas);
    // telefoon gedraaid of balken van de browser in- of uitgeschoven: opnieuw passend maken (ook even later, als het scherm tot rust is)
    function later() { pas(); setTimeout(pas, 350); setTimeout(pas, 900); }
    addEventListener('orientationchange', later); addEventListener('pageshow', later);
    if (window.visualViewport) visualViewport.addEventListener('resize', pas);
    // klik of F: volledig scherm
    function schermvullend() { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {}); }
    addEventListener('click', schermvullend); addEventListener('keydown', function (e) { if (e.key === 'f' || e.key === 'F') schermvullend(); });
    // het scherm wakker houden tijdens het projecteren (waar de browser dat toestaat)
    function wakker() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
    wakker(); document.addEventListener('visibilitychange', function () { if (!document.hidden) wakker(); });
})();
</script>
</body>
</html>
